<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work Calendar Events</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased flex flex-col items-center p-4 sm:p-8">

  <div class="w-full max-w-3xl">
    <!-- Header -->
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pb-6 border-b border-slate-800">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white flex items-center gap-2">
          <span>📅</span> Work Calendar Events
        </h1>
        <p class="text-sm text-slate-400 mt-1">
          Viewing scheduled events and total durations from <span class="text-indigo-400 font-medium">Work Calendar</span>
        </p>
      </div>

      <div id="auth-container">
        <button id="auth-btn" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm px-4 py-2.5 rounded-xl shadow-lg shadow-indigo-600/20 transition-all duration-150">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.24 10.285V14.4h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.345-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0c-6.635 0-12 5.365-12 12s5.365 12 12 12c6.926 0 11.52-4.869 11.52-11.726 0-.788-.085-1.39-.189-1.989H12.24z"/>
          </svg>
          <span>Sign In with Google</span>
        </button>
      </div>
    </header>

    <!-- Main Controls Card -->
    <section class="mt-6 bg-slate-900 border border-slate-800/80 rounded-2xl p-5 sm:p-6 shadow-xl backdrop-blur-sm">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Start Date -->
        <div>
          <label for="start-date" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
            Start Date
          </label>
          <div class="relative">
            <input 
              type="date" 
              id="start-date" 
              class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all cursor-pointer"
            />
          </div>
        </div>

        <!-- End Date -->
        <div>
          <label for="end-date" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
            End Date
          </label>
          <div class="relative">
            <input 
              type="date" 
              id="end-date" 
              class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all cursor-pointer"
            />
          </div>
        </div>
      </div>

      <!-- Quick Preset Filters -->
      <div class="flex flex-wrap items-center gap-2 mt-4 pt-4 border-t border-slate-800/60">
        <span class="text-xs text-slate-400 font-medium">Quick Select:</span>
        <button type="button" onclick="setPreset('today')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-3 py-1.5 rounded-lg transition-colors">Today</button>
        <button type="button" onclick="setPreset('week')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-3 py-1.5 rounded-lg transition-colors">This Week</button>
        <button type="button" onclick="setPreset('month')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-3 py-1.5 rounded-lg transition-colors">This Month</button>
      </div>

      <!-- Fetch Button -->
      <button 
        id="fetch-btn" 
        class="w-full mt-5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium text-sm py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/20 transition-all flex items-center justify-center gap-2"
        disabled
      >
        <span>View Events</span>
      </button>
    </section>

    <!-- Status & Notification -->
    <div id="status-bar" class="hidden mt-4 text-xs font-medium px-4 py-3 rounded-xl border"></div>

    <!-- Summary Bar -->
    <div id="summary-card" class="hidden mt-6 bg-slate-900/60 border border-slate-800 p-4 rounded-xl flex items-center justify-between">
      <div>
        <p class="text-xs text-slate-400">Total Events Found</p>
        <p id="total-count" class="text-lg font-bold text-white">0</p>
      </div>
      <div class="text-right">
        <p class="text-xs text-slate-400">Total Duration</p>
        <p id="total-duration" class="text-lg font-bold text-indigo-400">0h 0m</p>
      </div>
    </div>

    <!-- Event List -->
    <div id="events-container" class="mt-4 space-y-3">
      <div id="placeholder-box" class="py-14 text-center border border-dashed border-slate-800 rounded-2xl bg-slate-900/30">
        <p class="text-3xl mb-2">🗓️</p>
        <p class="text-slate-400 text-sm font-medium">Sign in and select a date range to list your events.</p>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------------------
    // User Configuration
    // -------------------------------------------------------------------------
    const CLIENT_ID = '620773682060-lsrd596iec4trv9su55kubdkuvv1hb0s.apps.googleusercontent.com';
    const CALENDAR_ID = 'c832cfbc5ab069b09abac008864362e5a66b65b13d1b86f1f5dd283196f0e5d8@group.calendar.google.com';
    const SCOPES = 'https://www.googleapis.com/auth/calendar.events.readonly';

    let tokenClient;
    let accessToken = null;

    // DOM Elements
    const authBtn = document.getElementById('auth-btn');
    const fetchBtn = document.getElementById('fetch-btn');
    const startDateInput = document.getElementById('start-date');
    const endDateInput = document.getElementById('end-date');
    const statusBar = document.getElementById('status-bar');
    const eventsContainer = document.getElementById('events-container');
    const summaryCard = document.getElementById('summary-card');
    const totalCountEl = document.getElementById('total-count');
    const totalDurationEl = document.getElementById('total-duration');

    // Default dates to current week
    function initDefaultDates() {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 7);
      startDateInput.value = start.toISOString().split('T')[0];
      endDateInput.value = end.toISOString().split('T')[0];
    }
    initDefaultDates();

    // Quick Date Range Helpers
    function setPreset(type) {
      const today = new Date();
      let start, end;

      if (type === 'today') {
        start = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        end = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      } else if (type === 'week') {
        const dayOfWeek = today.getDay();
        start = new Date(today);
        start.setDate(today.getDate() - dayOfWeek);
        end = new Date(start);
        end.setDate(start.getDate() + 6);
      } else if (type === 'month') {
        start = new Date(today.getFullYear(), today.getMonth(), 1);
        end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
      }

      startDateInput.value = start.toISOString().split('T')[0];
      endDateInput.value = end.toISOString().split('T')[0];

      if (accessToken) {
        fetchCalendarEvents();
      }
    }

    // Google Identity Services Initialization
    window.onload = () => {
      if (typeof google !== 'undefined') {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: (response) => {
            if (response.error !== undefined) {
              showStatus('Google Sign-In failed: ' + response.error, 'error');
              return;
            }
            accessToken = response.access_token;
            authBtn.innerHTML = `<span>✓ Connected</span>`;
            authBtn.classList.replace('bg-indigo-600', 'bg-emerald-600');
            authBtn.classList.replace('hover:bg-indigo-500', 'hover:bg-emerald-500');
            fetchBtn.disabled = false;
            showStatus('Successfully authenticated with Google.', 'success');
            fetchCalendarEvents();
          },
        });
      }
    };

    authBtn.addEventListener('click', () => {
      if (tokenClient) {
        tokenClient.requestAccessToken({ prompt: 'consent' });
      } else {
        showStatus('Google Identity Services script is still loading. Please try again in a few seconds.', 'error');
      }
    });

    fetchBtn.addEventListener('click', () => {
      fetchCalendarEvents();
    });

    // Main fetch routine
    async function fetchCalendarEvents() {
      if (!accessToken) return;

      const startDateStr = startDateInput.value;
      const endDateStr = endDateInput.value;

      if (!startDateStr || !endDateStr) {
        showStatus('Please choose both a start date and an end date.', 'error');
        return;
      }

      const timeMin = new Date(startDateStr + 'T00:00:00').toISOString();
      const timeMax = new Date(endDateStr + 'T23:59:59').toISOString();

      showStatus('Fetching events from Work Calendar...', 'info');

      try {
        const eventsUrl = new URL(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`);
        eventsUrl.searchParams.append('timeMin', timeMin);
        eventsUrl.searchParams.append('timeMax', timeMax);
        eventsUrl.searchParams.append('singleEvents', 'true');
        eventsUrl.searchParams.append('orderBy', 'startTime');

        const eventsRes = await fetch(eventsUrl, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });

        if (!eventsRes.ok) {
          const errData = await eventsRes.json();
          throw new Error(errData.error?.message || 'Failed to fetch calendar events.');
        }

        const eventsData = await eventsRes.json();
        renderEvents(eventsData.items || []);
        hideStatus();
      } catch (err) {
        console.error(err);
        showStatus(`Error: ${err.message}`, 'error');
      }
    }

    // Render events list
    function renderEvents(events) {
      eventsContainer.innerHTML = '';

      if (events.length === 0) {
        summaryCard.classList.add('hidden');
        eventsContainer.innerHTML = `
          <div class="py-12 text-center border border-slate-800 rounded-2xl bg-slate-900/30">
            <p class="text-slate-400 text-sm">No events found in this date range.</p>
          </div>
        `;
        return;
      }

      let totalMinutes = 0;

      events.forEach((ev) => {
        const title = ev.summary || '(Untitled Event)';
        const start = ev.start.dateTime ? new Date(ev.start.dateTime) : new Date(ev.start.date + 'T00:00:00');
        const end = ev.end.dateTime ? new Date(ev.end.dateTime) : new Date(ev.end.date + 'T23:59:59');

        const durationMs = end - start;
        const durationMins = Math.max(0, Math.round(durationMs / (1000 * 60)));
        totalMinutes += durationMins;

        const durationText = formatDuration(durationMins, !ev.start.dateTime);
        const dateFormatted = start.toLocaleDateString(undefined, {
          weekday: 'short',
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });

        const timeFormatted = ev.start.dateTime 
          ? `${start.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} – ${end.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`
          : 'All Day Event';

        const card = document.createElement('div');
        card.className = 'bg-slate-900/90 border border-slate-800/80 hover:border-slate-700/80 rounded-xl p-4 transition-all duration-150 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3';
        card.innerHTML = `
          <div class="flex items-start gap-3.5">
            <div class="w-1.5 h-10 rounded-full bg-indigo-500 mt-0.5"></div>
            <div>
              <h3 class="font-semibold text-white text-base">${escapeHtml(title)}</h3>
              <p class="text-xs text-slate-400 mt-0.5">${dateFormatted} • <span class="text-slate-300 font-medium">${timeFormatted}</span></p>
            </div>
          </div>
          <div class="sm:text-right pl-5 sm:pl-0">
            <span class="inline-flex items-center text-xs font-semibold px-2.5 py-1 rounded-lg bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">
              ⏱ ${durationText}
            </span>
          </div>
        `;
        eventsContainer.appendChild(card);
      });

      // Update Summary Bar
      summaryCard.classList.remove('hidden');
      totalCountEl.textContent = events.length;
      totalDurationEl.textContent = formatDuration(totalMinutes, false);
    }

    function formatDuration(minutes, isAllDay) {
      if (isAllDay) return 'All Day';
      const hrs = Math.floor(minutes / 60);
      const mins = minutes % 60;
      if (hrs === 0) return `${mins}m`;
      if (mins === 0) return `${hrs}h`;
      return `${hrs}h ${mins}m`;
    }

    function showStatus(msg, type) {
      statusBar.classList.remove('hidden', 'bg-red-500/10', 'text-red-400', 'border-red-500/20', 'bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20', 'bg-slate-800', 'text-slate-300', 'border-slate-700');
      if (type === 'error') {
        statusBar.classList.add('bg-red-500/10', 'text-red-400', 'border-red-500/20');
      } else if (type === 'success') {
        statusBar.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20');
      } else {
        statusBar.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-700');
      }
      statusBar.textContent = msg;
    }

    function hideStatus() {
      statusBar.classList.add('hidden');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
